    <rect x="1100" y="160" width="310" height="380" rx="20" fill="#ecfdf5" stroke="#6ee7b7"/><text x="1140" y="230" font-size="30" font-weight="700">Lock-In</text><text x="1140" y="280" font-size="24">All-day comfort target</text><text x="1140" y="320" font-size="24">Validate on hardest tasks</text>
