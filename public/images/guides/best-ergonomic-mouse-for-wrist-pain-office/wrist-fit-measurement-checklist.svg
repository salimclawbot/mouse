<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="90" y="90" width="1420" height="720" rx="28" fill="#fff" stroke="#cbd5e1"/>
  <text x="140" y="180" font-family="Inter,Arial" font-size="54" font-weight="700" fill="#0f172a">5-Step Wrist Fit Measurement Checklist</text>
  <g font-family="Inter,Arial" font-size="29" fill="#1e293b">
    <text x="160" y="280">1. Measure hand length: wrist crease to middle fingertip</text>
    <text x="160" y="355">2. Check palm width at widest point</text>
    <text x="160" y="430">3. Confirm thumb can rest without extension strain</text>
    <text x="160" y="505">4. Test 30 rapid clicks for effort consistency</text>
    <text x="160" y="580">5. Validate 90-minute comfort block before deciding</text>
  </g>
  <rect x="950" y="250" width="500" height="420" rx="20" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="990" y="320" font-family="Inter,Arial" font-size="34" font-weight="700" fill="#0f172a">Quick Rule</text>
  <text x="990" y="380" font-family="Inter,Arial" font-size="28" fill="#334155">If your ring finger curls</text>
  <text x="990" y="425" font-family="Inter,Arial" font-size="28" fill="#334155">or your thumb stretches,</text>
  <text x="990" y="470" font-family="Inter,Arial" font-size="28" fill="#334155">the shell is too large.</text>
</svg>