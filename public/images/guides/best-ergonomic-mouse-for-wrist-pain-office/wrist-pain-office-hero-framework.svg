<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ergonomic mouse wrist pain framework for office workers</title>
  <desc id="desc">Illustrated framework showing fit, click force, and desk posture priorities when buying an ergonomic mouse for wrist pain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ecfeff"/><stop offset="100%" stop-color="#dcfce7"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="80" y="80" width="1440" height="740" rx="28" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="130" y="170" font-family="Inter,Arial" font-size="52" font-weight="700" fill="#0f172a">Wrist-Pain Buying Framework (Office)</text>
  <text x="130" y="220" font-family="Inter,Arial" font-size="30" fill="#334155">Prioritize fit → click force → posture support → workflow reliability</text>
  <g font-family="Inter,Arial" font-size="28" fill="#0f172a">
    <rect x="130" y="280" width="640" height="130" rx="18" fill="#ecfeff" stroke="#67e8f9"/><text x="170" y="350">1) Fit: palm contact + thumb reach</text>
    <rect x="130" y="440" width="640" height="130" rx="18" fill="#ecfdf5" stroke="#6ee7b7"/><text x="170" y="510">2) Click force: low-effort switches</text>
    <rect x="130" y="600" width="640" height="130" rx="18" fill="#f0f9ff" stroke="#7dd3fc"/><text x="170" y="670">3) Posture: neutral forearm angle</text>
  </g>
  <g>
    <rect x="860" y="280" width="610" height="450" rx="22" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="900" y="340" font-family="Inter,Arial" font-size="34" font-weight="700" fill="#0f172a">Scorecard Target</text>
    <text x="900" y="395" font-family="Inter,Arial" font-size="28" fill="#334155">Fit & posture: 35%</text>
    <text x="900" y="445" font-family="Inter,Arial" font-size="28" fill="#334155">Long-session comfort: 25%</text>
    <text x="900" y="495" font-family="Inter,Arial" font-size="28" fill="#334155">Control reliability: 20%</text>
    <text x="900" y="545" font-family="Inter,Arial" font-size="28" fill="#334155">Value confidence: 20%</text>
    <text x="900" y="620" font-family="Inter,Arial" font-size="26" fill="#0f766e">Decision rule: keep the model that wins by day 5</text>
  </g>
</svg>